version: "3.9"

services:
  backend:
    build: ./backend
    container_name: intelli-credit-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/intelli_credit.db:/app/intelli_credit.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: intelli-credit-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
